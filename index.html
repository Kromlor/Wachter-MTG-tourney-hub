<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Tournament Organizer</title>
<style>

button.danger{color:var(--bad)}button.ghost{background:transparent}button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;font-size:16px}.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8a4fff);display:grid;place-items:center;color:#fff;font-size:15px}
.evname{font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.spacer{flex:1}
.timer{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px}
.timer .tl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdisp{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;min-width:64px;text-align:center}.tdisp.over{color:var(--bad)}.tdisp.low{color:var(--warn)}
.stepper{display:flex;gap:4px;padding:0 16px 10px;max-width:1280px;margin:0 auto;overflow-x:auto}
.step{flex:1;min-width:92px;text-align:center;font-size:12px;padding:5px 6px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.step.done{background:color-mix(in srgb,var(--good) 22%,var(--chip));color:var(--text)}.step.cur{background:var(--accent);color:#1a1205;font-weight:700}
nav.tabs{display:flex;gap:2px;max-width:1280px;margin:0 auto;padding:0 12px;overflow-x:auto}
nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card h3{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:860px){.cols2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}label.f>input,label.f>select{color:var(--text);font-size:14px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:600;color:var(--muted)}
.badge.acc{background:color-mix(in srgb,var(--accent) 25%,var(--chip));color:var(--text)}.badge.red{background:color-mix(in srgb,var(--bad) 25%,var(--chip));color:var(--text)}.badge.green{background:color-mix(in srgb,var(--good) 25%,var(--chip));color:var(--text)}
table.t{width:100%;border-collapse:collapse}table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.dropped td{opacity:.5}
.tw{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border-radius:999px;font-size:12px}.chips button.on{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:700}
.match{display:grid;grid-template-columns:54px 1fr auto 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.match.done{border-left:4px solid var(--good)}.match.open{border-left:4px solid var(--warn)}
.match .tbl{font-weight:800;font-size:18px;text-align:center;color:var(--accent)}.match .tbl small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.pl{min-width:0}.pl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl span{font-size:12px;color:var(--muted)}.pl.r{text-align:right}
.score{display:flex;flex-direction:column;align-items:center;gap:6px}.score .big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.quick button{padding:2px 7px;font-size:12px}.quick button.sel{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.nums{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}.nums input{width:42px;padding:2px 4px;text-align:center}
@media(max-width:700px){.match{grid-template-columns:40px 1fr;}.match .score{grid-column:1/-1}.match .pl.r{text-align:left;grid-column:2}.match .pl.r::before{content:"vs ";color:var(--muted);font-size:12px}}

.pod .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.pod .seat{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}.pod .seat:first-of-type{border-top:none}.pod .seat .sn{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700}
.pod .seat .nm{flex:1;min-width:0}.pod .seat.win .nm b{color:var(--good)}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:210px}
.bcol h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;text-align:center}
.bm{border:1px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden;font-size:13px}.bm.ready{border-color:var(--warn)}.bm.done{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}.bm.bye,.bm.void,.bm.skipped{opacity:.55}
.bm .bp{display:flex;justify-content:space-between;gap:6px;padding:5px 8px}.bm .bp+.bp{border-top:1px solid var(--line)}.bm .bp.w{font-weight:700;background:color-mix(in srgb,var(--good) 14%,transparent)}.bm .bp .sd{color:var(--muted);font-size:11px;margin-right:4px}
.bm .bid{font-size:10px;color:var(--muted);padding:2px 8px;background:var(--chip);display:flex;justify-content:space-between}
.bm .quick{padding:5px}
.champ{font-size:20px;font-weight:800;padding:14px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--panel)),var(--panel));border:1px solid var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.table-ring{position:relative;width:280px;height:280px;margin:8px auto}
.table-ring .felt{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--good) 30%,var(--panel2)),var(--panel2));border:2px solid var(--line);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}
.table-ring .felt b{display:block;font-size:26px;color:var(--accent)}
.table-ring .seatc{position:absolute;width:96px;transform:translate(-50%,-50%);text-align:center;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 4px;line-height:1.2}
.table-ring .seatc i{font-style:normal;color:var(--accent);font-weight:800;margin-right:3px}
.pickbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pickbox .bignum{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.pickbox .lbl{font-size:11px;color:var(--muted);text-transform:uppercase}
.dir{font-size:20px;font-weight:800}.dir.left{color:var(--accent2)}.dir.right{color:var(--accent)}
.packdirs{display:flex;gap:6px;flex-wrap:wrap}.packdirs span{padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12px}.packdirs span.cur{outline:2px solid var(--accent)}
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:24px}
.overlay .close{position:fixed;top:14px;right:18px;z-index:101}
.bigtimer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;gap:18px;text-align:center}
.bigtimer .ev{font-size:clamp(18px,3vw,34px);color:var(--muted);font-weight:600}.bigtimer .lab{font-size:clamp(24px,5vw,56px);font-weight:800}
.bigtimer .tdisp{font-size:clamp(90px,24vw,340px);line-height:1;min-width:0}
.fsgrid{columns:3 320px;column-gap:24px;font-size:clamp(14px,1.6vw,22px)}.fsgrid div{break-inside:avoid;display:flex;gap:10px;padding:4px 6px;border-bottom:1px solid var(--line)}.fsgrid .tn{min-width:56px;font-weight:800;color:var(--accent)}.fsgrid .nm{flex:1;font-weight:600}.fsgrid .op{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}.modal .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.demos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.demos button{text-align:left;padding:10px 12px}.demos button b{display:block}.demos button span{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow)}
.notice{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent2) 14%,var(--panel2));border:1px solid color-mix(in srgb,var(--accent2) 40%,var(--line));margin-bottom:12px;font-size:13px}
.notice.warn{background:color-mix(in srgb,var(--warn) 14%,var(--panel2));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.empty{text-align:center;padding:30px;color:var(--muted)}
#print-area{display:none}
@media print{body.printing #app,body.printing .toast{display:none!important}body.printing #print-area{display:block}#print-area{color:#000;background:#fff;font-size:12px}#print-area h1{font-size:18px;margin:0 0 4px}#print-area table{width:100%;border-collapse:collapse}#print-area td,#print-area th{border:1px solid #999;padding:4px 6px;text-align:left}html,body{background:#fff}}
.pod .seat .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evname{flex:0 1 auto;min-width:0}
@media(max-width:700px){header.top{position:static}.bar{gap:6px;padding:8px 10px}.bar>button{padding:5px 9px;font-size:13px}main{padding:10px}.card{padding:12px}}
@media(min-width:1000px){.bar{flex-wrap:nowrap}.bar>button{white-space:nowrap}}

<script id="mtg-core">
/* ===== MTG Tournament Core: pure logic (no DOM). Exposed as global `Core`. ===== */
var Core = (function () {
  'use strict';
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function seeded(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0; var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var idc = 0;
  function uid(p) { return (p || 'x') + Date.now().toString(36).slice(-5) + (idc++).toString(36) + Math.floor(Math.random() * 46656).toString(36); }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /* ---------- Formats & settings ---------- */
  var FORMAT_LIST = ['Standard', 'Modern', 'Pioneer', 'Legacy', 'Vintage', 'Pauper', 'Commander', 'cEDH', 'Booster Draft', 'Sealed', 'Cube', 'Two-Headed Giant', 'Team Sealed', 'Brawl', 'Oathbreaker', 'Custom'];
  var BASE_SETTINGS = {
    structure: 'swiss', matchType: '1v1', bestOf: 3, teamSize: 2, swissRounds: 0, topCut: 0, roundMinutes: 50, seeding: 'random',
    podTarget: 4, podMin: 3, podMax: 5, podPrefer: 'larger', podScoring: 'wlt', podWin: 3, podDraw: 1, podLoss: 0, placementPts: [4, 3, 2, 1, 0],
    lateEntry: 'loss', limited: 'none', setName: '', packsPerPlayer: 3, cardsPerPack: 14, draftPodMax: 8, pickTimer: 'mtr', pickSeconds: 40,
    autoAdvancePicks: true, deckbuildMinutes: 30, registrationMinutes: 0, sealedPacks: 6, sealedKit: 'boosters', teamPacks: 12,
    crossPairing: true, redraftTop8: false, gfReset: true, decklists: false
  };
  function presetFor(fmt) {
    var c = { structure: 'swiss', matchType: '1v1', bestOf: 3, roundMinutes: 50, limited: 'none', topCut: 0, swissRounds: 0, crossPairing: false, redraftTop8: false };
    switch (fmt) {
      case 'Standard': case 'Modern': case 'Pioneer': case 'Legacy': case 'Vintage': case 'Pauper': c.decklists = true; break;
      case 'Brawl': c.decklists = true; break;
      case 'Commander': Object.assign(c, { matchType: 'pod', podScoring: 'wlt', podWin: 3, podDraw: 1, podLoss: 0, roundMinutes: 80, bestOf: 1 }); break;
      case 'cEDH': Object.assign(c, { matchType: 'pod', podScoring: 'wlt', podWin: 5, podDraw: 1, podLoss: 0, roundMinutes: 90, topCut: 4, podPrefer: 'larger', bestOf: 1, decklists: true }); break;
      case 'Oathbreaker': Object.assign(c, { matchType: 'pod', podScoring: 'wlt', podWin: 3, podDraw: 1, podLoss: 0, roundMinutes: 60, bestOf: 1 }); break;
      case 'Booster Draft': Object.assign(c, { limited: 'draft', packsPerPlayer: 3, cardsPerPack: 14, crossPairing: true, swissRounds: 3, deckbuildMinutes: 30 }); break;
      case 'Cube': Object.assign(c, { limited: 'draft', setName: 'Cube', packsPerPlayer: 3, cardsPerPack: 15, crossPairing: true, swissRounds: 3, deckbuildMinutes: 30 }); break;
      case 'Sealed': Object.assign(c, { limited: 'sealed', sealedPacks: 6, sealedKit: 'boosters', deckbuildMinutes: 30 }); break;
      case 'Two-Headed Giant': Object.assign(c, { matchType: 'team', teamSize: 2, bestOf: 1, roundMinutes: 70, limited: 'sealed', teamPacks: 8, deckbuildMinutes: 60 }); break;
      case 'Team Sealed': Object.assign(c, { matchType: 'team', teamSize: 3, bestOf: 3, roundMinutes: 50, limited: 'sealed', teamPacks: 12, deckbuildMinutes: 60 }); break;
      case 'Custom': return {};
    }
    return c;
  }
  function applyPreset(fmt) { return Object.assign({}, BASE_SETTINGS, presetFor(fmt), { placementPts: BASE_SETTINGS.placementPts.slice() }); }
  function newTournament(o) {
    o = o || {};
    var fmt = o.format || 'Modern';
    return {
      v: 1, id: uid('t'), name: o.name || 'Friday Night Magic', format: fmt, created: Date.now(),
      settings: applyPreset(fmt), players: [], teams: [], phase: 'registration', rounds: [],
      draft: null, topDraft: null, deckbuilding: null, bracket: null, rrSchedule: null, startCount: 0,
      timer: { label: 'Timer', duration: 50 * 60, remaining: 50 * 60, running: false, startedAt: null }
    };
  }
  function suggestedRounds(n, matchType) {
    if (matchType === 'pod') return n <= 8 ? 3 : n <= 32 ? 4 : 5;
    if (n <= 1) return 0; if (n <= 2) return 1; if (n <= 4) return 2; if (n <= 8) return 3; if (n <= 16) return 4; if (n <= 32) return 5;
    if (n <= 64) return 6; if (n <= 128) return 7; if (n <= 226) return 8; if (n <= 409) return 9; return 10;
  }

  /* ---------- Competitors ---------- */
  function competitors(t) {
    if (t.settings.matchType === 'team') return t.teams.map(function (x) { return { id: x.id, name: x.name, dropped: !!x.dropped, joinedRound: x.joinedRound || 1, members: (x.members || []).slice() }; });
    return t.players.map(function (p) { return { id: p.id, name: p.name, dropped: !!p.dropped, joinedRound: p.joinedRound || 1, deck: p.deck || '' }; });
  }
  function activeIds(t, roundNum) { return competitors(t).filter(function (c) { return !c.dropped && c.joinedRound <= roundNum; }).map(function (c) { return c.id; }); }
  function maxPointsPerRound(s) {
    if (s.matchType !== 'pod') return 3;
    return s.podScoring === 'placement' ? Math.max.apply(null, s.placementPts.slice(0, Math.max(1, s.podMax))) : s.podWin;
  }
  function podPoints(s, m) {
    if (!m.res) return null; var pts = {};
    m.pod.forEach(function (c) {
      if (s.podScoring === 'placement') { var pl = m.res.places && m.res.places[c]; pts[c] = pl ? (Number(s.placementPts[pl - 1]) || 0) : 0; }
      else pts[c] = m.res.draw ? Number(s.podDraw) : (m.res.winner === c ? Number(s.podWin) : Number(s.podLoss));
    });
    return pts;
  }
  function podResultComplete(s, m) {
    if (!m.res) return false;
    if (s.podScoring === 'placement') return m.pod.every(function (c) { return m.res.places && m.res.places[c]; });
    return !!(m.res.draw || m.res.winner);
  }
  function matchComplete(s, m) { if (m.bye) return true; if (m.pod) return podResultComplete(s, m); return !!m.res; }
  function roundComplete(t, r) { return r.matches.every(function (m) { return matchComplete(t.settings, m); }); }

  /* ---------- Records & standings (MTR Appendix C) ---------- */
  function computeRecords(t) {
    var s = t.settings, isPod = s.matchType === 'pod';
    var comps = competitors(t), rec = {};
    comps.forEach(function (c) { rec[c.id] = { id: c.id, mp: 0, played: 0, w: 0, l: 0, d: 0, gw: 0, gl: 0, gd: 0, games: 0, gp: 0, opps: [], byes: 0, missed: 0 }; });
    t.rounds.forEach(function (r, ri) {
      if (r.kind === 'final') return;
      var rn = ri + 1, inRound = {};
      r.matches.forEach(function (m) {
        if (m.pod) {
          m.pod.forEach(function (c) { inRound[c] = 1; });
          if (!podResultComplete(s, m)) return;
          var pts = podPoints(s, m);
          m.pod.forEach(function (c) {
            var R = rec[c]; if (!R) return;
            R.mp += pts[c]; R.played++;
            var won = s.podScoring === 'placement' ? (m.res.places[c] === 1) : m.res.winner === c;
            if (m.res.draw) R.d++; else if (won) R.w++; else R.l++;
            m.pod.forEach(function (o) { if (o !== c) R.opps.push(o); });
          });
          return;
        }
        inRound[m.a] = 1; if (m.b) inRound[m.b] = 1;
        if (m.bye) { var R = rec[m.a]; if (!R) return; R.mp += 3; R.played++; R.w++; R.gw += 2; R.games += 2; R.gp += 6; R.byes++; return; }
        if (!m.res) return;
        var a = Number(m.res.a) || 0, b = Number(m.res.b) || 0, d = Number(m.res.d) || 0;
        [[rec[m.a], a, b, m.b], [rec[m.b], b, a, m.a]].forEach(function (z) {
          var R = z[0], x = z[1], y = z[2]; if (!R) return;
          R.played++; R.games += x + y + d; R.gw += x; R.gl += y; R.gd += d; R.gp += 3 * x + d; R.opps.push(z[3]);
          if (x > y) { R.w++; R.mp += 3; } else if (x < y) R.l++; else { R.d++; R.mp += 1; }

    printPairings: printPairings, printStandings: printStandings
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;

  });
  document.addEventListener('submit', function (e) {
    var f = e.target.dataset.form; if (!f) return; e.preventDefault();

      if (f === 'addPlayer') { addPlayer(fd.get('name'), fd.get('deck')); commit(); var i = document.querySelector('[data-form=addPlayer] input[name=name]'); if (i) i.focus(); }
      if (f === 'bulk') { String(fd.get('bulk') || '').split(/\r?\n/).forEach(function (l) { var p = l.split(','); if (p[0].trim()) addPlayer(p[0], p.slice(1).join(',')); }); commit(); }
      if (f === 'addTeam') { T.teams.push({ id: Core.uid('tm'), name: String(fd.get('name') || '').trim() || 'Team ' + (T.teams.length + 1), members: [], joinedRound: inPlay() ? T.rounds.length + 1 : 1 }); commit(); }
    });
  });
  document.addEventListener('change', function (e) {
    var el = e.target, d = el.dataset;
    if (d.set) {
      var v = d.type === 'bool' ? el.checked : d.type === 'num' ? Number(el.value) : d.type === 'list' ? el.value.split(/[,\s]+/).filter(Boolean).map(Number) : el.value;
      if (['bestOf', 'teamSize', 'topCut'].indexOf(d.set) >= 0) v = Number(v);
      S()[d.set] = v;
      if (d.set === 'roundMinutes' && !T.timer.running && /^(Round|Match|Timer|Final|Top)/.test(T.timer.label)) { T.timer.duration = T.timer.remaining = v * 60; }
      if ((d.set === 'deckbuildMinutes' || d.set === 'registrationMinutes') && !T.timer.running && (T.phase === 'deckbuilding' || T.phase === 'topdeck')) Flow.setDeckTimer(T);
      commit(); return;
    }
    if (d.tset === 'name') { T.name = el.value; commit(); return; }
    if (d.tset === 'format') {
      if (inPlay() || T.phase !== 'registration') { if (!confirm('The event is in progress. Change only the format label (keep current settings)?')) { render(); return; } T.format = el.value; commit(); return; }
      T.format = el.value; T.settings = Core.applyPreset(el.value); toast('Applied ' + el.value + ' defaults'); commit(); return;
    }
    if (d.pf) {
      var p = T.players.find(function (x) { return x.id === d.id; }); if (!p) return;
      if (d.pf === 'team') { T.teams.forEach(function (tm) { tm.members = tm.members.filter(function (m) { return m !== p.id; }); }); var tm = T.teams.find(function (x) { return x.id === el.value; }); if (tm) tm.members.push(p.id); }
      else p[d.pf] = d.pf === 'name' ? (el.value.trim() || p.name) : el.value;
      commit(); return;
    }
    if (d.tf) { var t2 = T.teams.find(function (x) { return x.id === d.id; }); if (t2) t2.name = el.value.trim() || t2.name; commit(); return; }
    if (d.res) { var m = findMatch(d.mid); var r = m.res || { a: 0, b: 0, d: 0 }; r[d.res] = Math.max(0, Number(el.value) || 0); delete r.id; m.res = r; commit(); return; }
    if (d.podwin) { var pm = findMatch(d.podwin); pm.res = el.value === '__draw' ? { draw: true } : el.value ? { winner: el.value } : null; commit(); return; }
    if (d.podplace) { var qm = findMatch(d.podplace); qm.res = qm.res || { places: {} }; qm.res.places = qm.res.places || {}; if (el.value) qm.res.places[d.cid] = Number(el.value); else delete qm.res.places[d.cid]; commit(); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (UI.overlay || UI.modal)) { UI.overlay = null; UI.modal = null; render(); }
    if (e.key === ' ' && UI.overlay === 'timer') { e.preventDefault(); timerToggle(); }
  });

  /* ---------- Demo tournaments ---------- */
  var NAMES = ['Alex Chen', 'Brianna Ortiz', 'Caleb Nguyen', 'Dana Whitfield', 'Elijah Brooks', 'Fatima Haddad', 'Gabe Moreno', 'Hana Sato', 'Isaac Turner', 'Jade Kowalski', 'Kofi Mensah', 'Lena Fischer', 'Marco Rossi', 'Nadia Petrova', 'Owen Gallagher', 'Priya Raman', 'Quinn Harper', 'Rosa Delgado', 'Sam Okafor', 'Tess Lindqvist', 'Umar Siddiqui', 'Vera Novak', 'Wes Callahan', 'Ximena Ruiz', 'Yuki Tanaka', 'Zane Mercer', 'Ava Sinclair', 'Ben Adler', 'Cora Bianchi', 'Dev Patel', 'Elle Moreau', 'Finn O’Neill'];
  var MODERN = ['Boros Energy', 'Ruby Storm', 'Amulet Titan', 'Eldrazi Ramp', 'Living End', 'Jeskai Control', 'Izzet Murktide', 'Goryo’s Vengeance', 'Mono-Black Necro', 'Domain Zoo', 'Hammer Time', 'Burn', 'Yawgmoth', 'Affinity', 'Dimir Frog', 'Tron', 'Merfolk'];
  var CMDRS = ['Atraxa, Praetors’ Voice', 'Krenko, Mob Boss', 'The Ur-Dragon', 'Edgar Markov', 'Kenrith, the Returned King', 'Yuriko, the Tiger’s Shadow', 'Lathril, Blade of the Elves', 'Prosper, Tome-Bound', 'Muldrotha, the Gravetide', 'Miirym, Sentinel Wyrm', 'Isshin, Two Heavens as One', 'Sythis, Harvest’s Hand', 'Kinnan, Bonder Prodigy', 'Tymna & Thrasios'];
  var LIMITED = ['UW Fliers', 'BR Aggro', 'GW Go-wide', 'UB Control', 'RG Midrange', 'WB Lifegain', 'UR Spells', 'BG Graveyard', 'Mono-Green', 'Jund Splash'];
  function mk(fmt, name, n, decks) { var t = Core.newTournament({ name: name, format: fmt }); for (var i = 0; i < n; i++) t.players.push({ id: Core.uid('p'), name: NAMES[i % NAMES.length] + (i >= NAMES.length ? ' II' : ''), deck: decks ? decks[i % decks.length] : '', dropped: false, joinedRound: 1, decklist: '' }); return t; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function simMatch(t, m) {
    var s = t.settings;
    if (m.bye) return;
    if (m.pod) { if (s.podScoring === 'placement') { var pl = {}; Core.shuffle(m.pod).forEach(function (c, i) { pl[c] = i + 1; }); m.res = { places: pl }; } else m.res = Math.random() < 0.07 ? { draw: true } : { winner: pick(m.pod) }; return; }
    var bo = Number(s.bestOf), o = bo === 1 ? [[1, 0], [0, 1]] : bo === 5 ? [[3, 0], [3, 1], [3, 2], [2, 3], [1, 3], [0, 3]] : [[2, 0], [2, 1], [2, 1], [1, 2], [0, 2], [1, 2], [2, 0], [0, 2], [1, 1]];
    var r = pick(o); m.res = { a: r[0], b: r[1], d: 0 };
  }
  function simRound(t) { t.rounds[t.rounds.length - 1].matches.forEach(function (m) { simMatch(t, m); }); }
  function simRoundExact(t, count) { var k = 0; t.rounds[t.rounds.length - 1].matches.forEach(function (m) { if (!m.bye && k < count) { simMatch(t, m); k++; } }); }
  function runTimer(t, minutesAgo) { t.timer.running = true; t.timer.startedAt = Date.now() - minutesAgo * 60000; }
  function deckText(main) { var lands = 17, spells = main - lands; return '// Main\n' + spells + ' Assorted spells\n' + lands + ' Basic lands\n\nSideboard\n12 Other pool cards'; }
  var DEMOS = [
    { title: 'Modern Showdown — Swiss + Top 8', desc: '15 players + 1 late entry, 1 drop, Bo3, round 3 of 5 in progress, timer running', tab: 'pairings', build: function () {
      var t = mk('Modern', 'Modern Showdown', 15, MODERN); t.settings.topCut = 8; t.settings.swissRounds = 5;
      t.players.forEach(function (p) { p.decklist = '4 Main deck cards\n56 More main deck cards\n\nSideboard\n15 Sideboard cards'; });
      Flow.start(t); simRound(t); t.players[5].dropped = true; t.players[5].droppedAfter = 1; Flow.generateRound(t);
      t.players.push({ id: Core.uid('p'), name: 'Leo Marchetti', deck: 'Burn', joinedRound: 3, dropped: false, decklist: '' });
      simRound(t); Flow.generateRound(t); simRoundExact(t, 5); runTimer(t, 21); return t; } },
    { title: 'Booster Draft — in the draft', desc: '12 players, 2 pods of 6, pack 2 pick 5 (pass right), cross-table round 1', tab: 'draft', build: function () {
      var t = mk('Booster Draft', 'Duskmourn Booster Draft', 12, LIMITED); t.settings.setName = 'Duskmourn';
      Flow.start(t); t.draft.pack = 2; t.draft.pick = 5; t.draft.started = true; Flow.setPickTimer(t, false); return t; } },
    { title: 'Vintage Cube — Top 8 re-draft', desc: '16 players, 4 Swiss rounds done, top 8 seated for a re-draft', tab: 'draft', build: function () {
      var t = mk('Cube', 'Vintage Cube Open', 16, LIMITED); t.settings.setName = 'Vintage Cube'; t.settings.swissRounds = 4; t.settings.topCut = 8; t.settings.redraftTop8 = true;
      Flow.start(t); t.draft.pack = 3; t.draft.pick = 15; Flow.finishDraft(t); Flow.nextDeckStage(t); for (var i = 0; i < 4; i++) { if (i) Flow.generateRound(t); simRound(t); } Flow.startTopCut(t); return t; } },
    { title: 'Prerelease Sealed — deckbuilding', desc: '10 players with prerelease kits, 15 min pool registration then 30 min build', tab: 'deck', build: function () {
      var t = mk('Sealed', 'Saturday Prerelease', 10, LIMITED); t.settings.setName = 'Bloomburrow'; t.settings.sealedKit = 'prerelease'; t.settings.registrationMinutes = 15;
      t.players.forEach(function (p, i) { if (i < 6) p.decklist = deckText(i === 2 ? 38 : 40); });
      Flow.start(t); Flow.nextDeckStage(t); runTimer(t, 8); return t; } },
    { title: 'Commander Night — 13 players in pods', desc: 'Pods of 5/4/4 avoiding repeat pod-mates, round 2 in progress', tab: 'pairings', build: function () {
      var t = mk('Commander', 'Commander Night', 13, CMDRS); t.settings.swissRounds = 3; Flow.start(t); simRound(t); Flow.generateRound(t); simRoundExact(t, 1); runTimer(t, 34); return t; } },
    { title: 'cEDH — placement scoring + final table', desc: '16 players, placement points 4/3/2/1, 3 rounds done, top-4 final pod next', tab: 'standings', build: function () {
      var t = mk('cEDH', 'cEDH Championship', 16, CMDRS); t.settings.podScoring = 'placement'; t.settings.swissRounds = 3; Flow.start(t); for (var i = 0; i < 3; i++) { if (i) Flow.generateRound(t); simRound(t); } return t; } },

      var t = mk('Team Sealed', 'Team Sealed Trios', 18, LIMITED); t.settings.setName = 'Outlaws of Thunder Junction';

      var t = mk('Pauper', 'Pauper Double Elim', 8, ['Mono-Red Kuldotha', 'Dimir Terror', 'Affinity', 'Caw-Gates', 'Elves', 'Familiars', 'Boros Synth', 'Walls Combo']); t.settings.structure = 'double'; Flow.start(t);
      var br = t.bracket; ['W1-0', 'W1-1', 'W1-2', 'W1-3', 'L1-0', 'W2-0'].forEach(function (id) { var o = Core.resolveBracket(br)[id]; if (o.status === 'ready') { var w = Math.random() < 0.5 ? 0 : 1; Core.setBracketResult(br, id, o.p[w], w ? 1 : 2, w ? 2 : 1); } }); return t; } },
    { title: 'Legacy — round robin league', desc: '6 players, 5-round round robin, round 3 in progress', tab: 'pairings', build: function () {
      var t = mk('Legacy', 'Legacy League', 6, ['Delver', 'Reanimator', 'Lands', 'Death & Taxes', 'Show and Tell', 'Painter']); t.settings.structure = 'rr'; Flow.start(t); simRound(t); Flow.generateRound(t); simRound(t); Flow.generateRound(t); simRoundExact(t, 1); return t; } }
  ];

  /* ---------- boot ---------- */
  try { if (localStorage.getItem(THEME_KEY) === 'light') document.documentElement.classList.add('light'); } catch (e) { }
  load(); render();
  setInterval(function () { tick(false); }, 250);
  window.MTG = { get T() { return T; }, render: render, DEMOS: DEMOS, ACT: ACT, UI: UI };
})();
